---
name: out binary with in length
desc: verify out binary keeps explicit input length in python client and server
idl: |
  enum OisAxis {
    kOisAxisX = 0
  }

  enum OisErrorCode {
    kOisErrorOk = 0
  }

  interface sis7900 {
    ois_sis7900_read_reg(in OisAxis axis, in uint8 reg, out binary val @length(length), in uint16 length) -> OisErrorCode
  }
lang: py
test/interface.py:
  - def ois_sis7900_read_reg(self, axis, reg, val, length)
test/client.py:
  - def ois_sis7900_read_reg(self, axis, reg, val, length)
  - codec.write_uint16(length)
  - val.value = codec.read_binary()
test/server.py:
  - length = codec.read_uint16()
  - self._handler.ois_sis7900_read_reg(axis, reg, val, length)
  - codec.write_binary(val.value)

---
name: in list param
desc: verify in list params with @length
idl: |
  interface foo {
    bar(list<bool> l @length(c), int32 c) -> void
  }
lang: py
test/interface.py:
  - def bar(self, l)
test/client.py:
  - def bar(self, l)
  - start_write_list(len(l))
test/server.py:
  - start_read_list
  - not: codec.read_int32()

---
name: out list param
desc: verify out list params with @length
idl: |
  interface foo {
    bar(out list<bool> l @length(c) @max_length(10), out int32 c) -> void
  }
lang: py
test/interface.py:
  - def bar(self, l)
test/client.py:
  - def bar(self, l)
  - perform_request
  - start_read_list
  - not: codec.read_int32()
test/server.py:
  - def _handle_bar
  - self._handler.bar(l)
  - codec.start_write_message
  - not: codec.write_int32(len(l.value))

